<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#123c31">
  <title>Wertweit · Passwort festlegen</title>
  <style>
    :root { color-scheme: light; --forest: #123c31; --paper: #f4f5ef; --ink: #14241f; --muted: #69746d; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 20px; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 430px); padding: 28px; border: 1px solid rgba(20,36,31,.13); background: white; }
    h1 { margin: 0; font-size: 28px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.55; }
    form { display: grid; gap: 14px; margin-top: 24px; }
    label { display: grid; gap: 7px; font-size: 12px; font-weight: 600; }
    input, button { min-height: 46px; padding: 0 12px; border: 1px solid rgba(20,36,31,.18); border-radius: 4px; font: inherit; }
    button { border: 0; background: var(--forest); color: white; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    #status { min-height: 24px; font-size: 13px; }
    #status.error { color: #9d3528; }
    #status.success { color: var(--forest); }
  </style>
</head>
<body>
  <main>
    <h1>Passwort festlegen</h1>
    <p>Lege ein Passwort für dein Wertweit-Konto fest. Verwende mindestens acht Zeichen.</p>
    <form id="password-form" hidden>
      <label>Neues Passwort<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Passwort wiederholen<input id="password-confirmation" type="password" autocomplete="new-password" minlength="8" required></label>
      <button id="save-button" type="submit">Passwort speichern</button>
    </form>
    <p id="status" role="status">Einladungslink wird geprüft …</p>
  </main>
  <script src="./supabase-config.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const config = window.WERTWEIT_SUPABASE;
    const form = document.querySelector("#password-form");
    const status = document.querySelector("#status");
    const button = document.querySelector("#save-button");
    const setStatus = (message, kind = "") => {
      status.textContent = message;
      status.className = kind;
    };

    if (!config?.url || !config?.publishableKey || config.publishableKey.startsWith("REPLACE_")) {
      setStatus("Wertweit ist noch nicht eingerichtet.", "error");
    } else {
      const supabase = createClient(config.url, config.publishableKey);
      const { data, error } = await supabase.auth.getSession();
      if (error || !data.session) {
        setStatus("Dieser Link ist abgelaufen oder wurde bereits verwendet. Bitte fordere einen neuen Einladungs- oder Passwortlink an.", "error");
      } else {
        form.hidden = false;
        setStatus(`Konto ${data.session.user.email ?? ""} bestätigt. Lege jetzt dein Passwort fest.`);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = document.querySelector("#password").value;
        const confirmation = document.querySelector("#password-confirmation").value;
        if (password.length < 8 || password !== confirmation) {
          setStatus(password !== confirmation ? "Die Passwörter stimmen nicht überein." : "Das Passwort muss mindestens acht Zeichen haben.", "error");
          return;
        }
        button.disabled = true;
        setStatus("Passwort wird gespeichert …");
        const { error: updateError } = await supabase.auth.updateUser({ password });
        if (updateError) {
          setStatus(updateError.message, "error");
          button.disabled = false;
          return;
        }
        setStatus("Passwort gespeichert. Du kannst dich jetzt in der Wertweit-App anmelden.", "success");
        form.reset();
      });
    }
  </script>
</body>
</html>
